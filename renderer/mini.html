<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'none'">
<title>SnowVPN Mini</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cy:#3df0e6;--grad:linear-gradient(135deg,#41f0e0,#41a0ff);--ink:#eaf6f9;--dim:#7fa5b0}
html,body{height:100%;background:transparent;overflow:hidden}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
.card{position:relative;height:100%;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;
  background:rgba(10,24,32,.88);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.45);
  -webkit-app-region:drag}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:#5b6a72;flex-shrink:0;transition:.3s}
.dot.on{background:#43e08a;box-shadow:0 0 8px #43e08a88}
.dot.busy{background:#ffc266;box-shadow:0 0 8px #ffc26688}
.srv{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.btn{-webkit-app-region:no-drag;cursor:pointer;border:none;background:transparent;color:var(--dim);width:24px;height:24px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.mid{display:flex;align-items:center;gap:12px;flex:1}
.pwr{-webkit-app-region:no-drag;cursor:pointer;width:46px;height:46px;border-radius:50%;flex-shrink:0;border:none;
  background:rgba(255,255,255,.07);color:var(--dim);display:flex;align-items:center;justify-content:center;transition:.25s}
.pwr svg{width:20px;height:20px}
.pwr.on{background:var(--grad);color:#062a28;box-shadow:0 4px 16px rgba(65,220,210,.4)}
.pwr.busy{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.stats{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--dim);min-width:0}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.stat-row{display:flex;gap:10px;white-space:nowrap}
.status{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <span class="dot" id="mDot"></span>
      <span class="srv" id="mSrv">SnowVPN</span>
      <button class="btn" id="mExpand" title="Развернуть в полное окно">⤢</button>
    </div>
    <div class="mid">
      <button class="pwr" id="mPwr" title="Подключить / отключить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.5a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <div class="stats">
        <div class="stat-row"><span>↓ <b id="mDl">0.0</b></span><span>↑ <b id="mUl">0.0</b></span><span>Мбит/с</span></div>
        <div class="status" id="mStatus">офлайн</div>
      </div>
    </div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
